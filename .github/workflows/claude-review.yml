# AI co-review on every pull request.
#
# One reviewer on Sonnet 5 reads the diff and posts inline comments for real
# issues plus one summary comment. It is advisory: findings never block a merge,
# and `test.yml` stays the only gate.
#
# Why not Anthropic's /code-review plugin: it fans out to eight or more agents,
# several on Opus, and on the 72 file v7 diff that cost about $2 a run. Its tool
# needs also clash with the action's --allowedTools, so two runs costing $3.84
# posted nothing. A single agent with a written prompt is a fraction of the cost
# and every tool it uses is listed below.
#
# Auth is an API key (`gh secret set ANTHROPIC_API_KEY`), billed per token. A
# subscription token from `claude setup-token` was tried first and is not used:
# the action fails it about two seconds in with `is_error:true` and no error
# text, even though the same token answers fine from a local curl. That is
# anthropics/claude-code-action#1614, open with no maintainer response.
name: claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  # Per PR, not per ref. A push while a review is mid-flight should replace
  # that review rather than pay for both.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are not ready for a paid review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Write only to pull request comments. The reviewer has no business pushing
    # to the branch, so contents stays read.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Checked out so the reviewer can read AGENTS.md and the code around
          # a change. The diff itself comes from the GitHub API.
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}, a React Native (Expo) Solana trading app.

            1. Read AGENTS.md at the repo root. Its rules are the review criteria alongside correctness.
            2. Run `gh pr view ${{ github.event.pull_request.number }}` for the title and description, then `gh pr diff ${{ github.event.pull_request.number }}` for the changes.
            3. Review the diff in one pass yourself. Do not launch subagents. Read surrounding code with Read, Grep or Glob only when a suspected issue cannot be confirmed from the diff alone.

            Flag only high signal issues you have confirmed:
            - Code that will not compile or will crash
            - Logic that definitely produces wrong results
            - Money and chain code that breaks an AGENTS.md rule (signing without simulating, treating a confirmation timeout as a failure, retrying a write to the website, passing a Uint8Array to Openfort signMessage, anything secret under src/)
            - A clear AGENTS.md violation you can quote the rule for

            Do not flag style, naming, formatting, lint or type errors CI already catches, missing tests in general, pre-existing issues outside the diff, or anything you are not sure about. An empty review is a good review.

            4. For each confirmed issue, post one inline comment with `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`. Say what is wrong and why, briefly. Include a suggestion block only when committing it fully fixes the issue.
            5. Always finish with exactly one summary comment, even when there are no issues, using:
               `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "<summary>"`
               Start the summary with "## Claude review". Give the issue count and one line per issue, or "No issues found." If `--create-if-none` is rejected, retry without `--edit-last --create-if-none`.

            Never use an em dash in any comment.
          # Every tool the prompt uses must be listed: --allowedTools is the
          # whole allowlist, and the action only starts the inline comment MCP
          # server when its tool is named here.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 20
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
