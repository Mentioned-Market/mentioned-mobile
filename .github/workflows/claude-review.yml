# AI co-review on every pull request.
#
# One reviewer reads the diff and posts inline comments for real issues plus one
# summary comment. It is advisory: findings never block a merge, and `test.yml`
# stays the only gate.
#
# Cost is driven by diff size, because the reviewer pays to re-read its context
# on every turn. So a prep step decides before any model runs:
#   - code diff up to 120KB: Haiku 4.5, automatically
#   - larger: skipped with a comment, unless the PR has the `claude-review`
#     label, which runs it on Sonnet 5 (Haiku's 200k context cannot hold it)
#   - docs and assets only: skipped silently
# The 9000 line v7 diff cost $0.55 on Sonnet and still ran out of turns, which
# is what this guards against.
#
# The diff is split into files under 60KB before the reviewer starts. Claude
# Code saves any command output over about 30k characters to a file and shows a
# preview, so running `gh pr diff` inside the session spent a turn per page.
#
# Why not Anthropic's /code-review plugin: it fans out to eight or more agents,
# several on Opus, costing about $2 a run on v7, and its tool needs clash with
# the action's --allowedTools, so two runs costing $3.84 posted nothing.
#
# Auth is an API key (`gh secret set ANTHROPIC_API_KEY`), billed per token. A
# subscription token from `claude setup-token` fails in the action about two
# seconds in with `is_error:true` and no error text, while the same token works
# from a local curl: anthropics/claude-code-action#1614, still open.
name: claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, labeled]

concurrency:
  # Per PR, not per ref. A push while a review is mid-flight should replace
  # that review rather than pay for both.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Drafts are not ready for a paid review. Adding any label other than
    # claude-review must not start a run.
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    # Write only to pull request comments. The reviewer has no business pushing
    # to the branch, so contents stays read.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare diff and choose model
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'claude-review') }}
          AUTO_LIMIT: '120000'
        run: |
          mkdir -p .review
          gh pr view "$PR" --json title,body --jq '"# " + .title + "\n\n" + (.body // "")' > .review/pr.md
          gh pr diff "$PR" --color never > .review/full.diff

          # Split on file boundaries into chunks under 60KB, leaving out docs,
          # assets and the lockfile, which the review does not judge.
          awk -v max=60000 -v dir=.review '
          function flush() {
            if (blk == "") return
            if (!skip) {
              if (n == 0 || (size > 0 && size + length(blk) > max)) {
                if (out != "") close(out)
                n++; size = 0; out = sprintf("%s/chunk-%02d.diff", dir, n)
              }
              printf "%s", blk > out
              size += length(blk)
              print out "\t" path > (dir "/index.txt")
            }
            blk = ""
          }
          /^diff --git / {
            flush()
            path = substr($3, 3)
            skip = (path ~ /\.md$/ || path ~ /^assets\// || path ~ /(^|\/)package-lock\.json$/)
          }
          { blk = blk $0 "\n" }
          END { flush() }
          ' .review/full.diff

          bytes=$(cat .review/chunk-*.diff 2>/dev/null | wc -c | tr -d ' ')
          echo "code diff: ${bytes} bytes"

          if [ "$bytes" -eq 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$bytes" -le "$AUTO_LIMIT" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "model=claude-haiku-4-5-20251001" >> "$GITHUB_OUTPUT"
          elif [ "$LABELED" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "model=claude-sonnet-5" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            kb=$((bytes / 1000))
            gh pr comment "$PR" --edit-last --create-if-none --body "## Claude review skipped

          This PR has ${kb}KB of code changes, over the ${AUTO_LIMIT%???}KB automatic limit. Add the \`claude-review\` label to review it anyway on Sonnet 5, which costs more on a diff this size. Smaller PRs are reviewed automatically."
          fi

      - name: Review
        id: review
        if: steps.prep.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}, a React Native (Expo) Solana trading app.

            Everything you need is already on disk. Do not fetch the PR yourself.
            1. Read AGENTS.md at the repo root. Its rules are the review criteria alongside correctness.
            2. Read .review/pr.md for the title and description, and .review/index.txt for which chunk holds which file.
            3. Read each .review/chunk-NN.diff in order, one Read call per chunk. Review in one pass yourself. Do not launch subagents. Use Read, Grep or Glob on the source only when a suspected issue cannot be confirmed from the diff, and keep that to a handful of calls.

            Flag only high signal issues you have confirmed:
            - Code that will not compile or will crash
            - Logic that definitely produces wrong results
            - Money and chain code that breaks an AGENTS.md rule (signing without simulating, treating a confirmation timeout as a failure, retrying a write to the website, passing a Uint8Array to Openfort signMessage, anything secret under src/)
            - A clear AGENTS.md violation you can quote the rule for

            Do not flag style, naming, formatting, lint or type errors CI already catches, missing tests in general, pre-existing issues outside the diff, or anything you are not sure about. An empty review is a good review.

            4. For each confirmed issue, post one inline comment with `mcp__github_inline_comment__create_inline_comment` and `confirmed: true` as soon as you confirm it. Say what is wrong and why, briefly. Include a suggestion block only when committing it fully fixes the issue.
            5. Always finish with exactly one summary comment, even when there are no issues:
               `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "<summary>"`
               Start it with "## Claude review". Give the issue count and one line per issue, or "No issues found."

            Never use an em dash in any comment.
          # --allowedTools is the whole allowlist, and the action only starts
          # the inline comment MCP server when its tool is named here.
          claude_args: >-
            --model ${{ steps.prep.outputs.model }}
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

      # A review that errors or runs out of turns posts nothing itself, and a
      # silent failure is how two paid runs went unnoticed. This costs nothing.
      - name: Report an unfinished review
        if: failure() && steps.review.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh pr comment "$PR" --body "## Claude review did not finish

          The review errored or ran out of turns before posting a summary. Details are in the [run log](${RUN_URL})."
