# Typecheck, lint and unit tests on every push and pull request. Everything
# here runs offline against captured fixtures, so it never depends on
# mentioned.market being up.
name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11, which is the major that writes this
          # lockfile. Node 20 ships npm 10, and npm 10 computes a different
          # ideal tree, so `npm ci` rejects the lockfile as out of sync.
          node-version: 24
          cache: npm

      # Not `npm ci`. npm hoists the dependencies of a transitive optional
      # package (@unrs/resolver-binding-wasm32-wasi, pulled in by eslint's
      # import resolver) differently on macOS, where this lockfile is written,
      # and on Linux, where CI runs. `npm ci` reads that as an out-of-sync
      # lockfile and refuses. Exact lockfile reproduction is not what this CI
      # is for: the release APK is built locally, not here.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci --runInBand
